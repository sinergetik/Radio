<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TMA DSP Audio Studio</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --sec-bg: #1e293b;
      --text-color: #f8fafc;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass-card {
      background: rgba(30, 41, 59, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #ffffff;
      cursor: pointer;
    }
    .fake-fs {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      z-index: 99999 !important;
      border-radius: 0 !important;
      margin: 0 !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-6">

  <div class="max-w-md w-full mx-auto px-4 pt-3 space-y-3">
    <div class="glass-card rounded-3xl p-4 shadow-2xl relative overflow-hidden">
      <div class="flex items-center justify-between mb-2">
        <div class="min-w-0 pr-2">
          <span class="text-[10px] font-bold uppercase tracking-wider text-sky-400 flex items-center gap-1" id="source-type-badge">
            ГОТОВ К ЗАПУСКУ
          </span>
          <h2 class="text-base font-bold truncate max-w-[210px]" id="now-playing-title">Выберите радио или файл</h2>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="fullscreen-app-btn" class="w-8 h-8 rounded-lg bg-white/10 text-sm flex items-center justify-center border border-white/10">⛶</button>
          <button id="vis-mode-btn" class="px-2.5 py-1.5 rounded-lg bg-white/10 text-[10px] mono text-slate-300 border border-white/10">📊 Спектр</button>
          <button id="settings-btn" class="w-8 h-8 rounded-lg bg-white/10 text-sm flex items-center justify-center border border-white/10">⚙️</button>
        </div>
      </div>

      <div id="vis-container" class="relative w-full h-44 rounded-2xl bg-slate-950/90 border border-white/10 overflow-hidden shadow-inner flex items-center justify-center">
        <canvas id="visualizer-canvas" class="w-full h-full block" width="650" height="348"></canvas>
        <div class="absolute top-2 left-2 flex items-center gap-1.5 px-2 py-1 rounded-md bg-black/60 backdrop-blur-md border border-white/10 pointer-events-none">
           <span id="live-dot-top" class="w-2 h-2 rounded-full bg-slate-500"></span>
           <span id="buffer-info" class="text-[9px] mono text-slate-300 font-bold">0 kb/s | LIVE</span>
        </div>
      </div>

      <div class="mt-4 flex items-center justify-between gap-2">
        <button id="main-prev-btn" class="flex-1 h-11 rounded-xl font-bold text-xl bg-white/5 border border-white/10 text-slate-300">⏮</button>
        <button id="main-play-btn" class="flex-1 h-11 rounded-xl font-bold text-xl bg-gradient-to-r from-sky-400 to-indigo-500 text-slate-950 shadow-lg shadow-sky-500/25">
          <span id="main-play-icon">▶</span>
        </button>
        <button id="main-next-btn" class="flex-1 h-11 rounded-xl font-bold text-xl bg-white/5 border border-white/10 text-slate-300">⏭</button>
        <button id="main-stop-btn" class="flex-1 h-11 rounded-xl font-bold text-xl bg-rose-500/20 border border-rose-400/30 text-rose-300">⏹</button>
      </div>

      <div class="mt-4 space-y-3 pt-4 border-t border-white/10">
        <select id="radio-select" class="w-full p-3 rounded-xl bg-slate-900/90 border border-white/10 text-[11px] font-bold text-white focus:outline-none">
          <option value="https://radiorecord.hostingradio.ru/rr_main96.aacp">🔥 Record - Основной</option>
          <option value="https://radiorecord.hostingradio.ru/deep96.aacp">🌊 Record Deep</option>
          <option value="https://radiorecord.hostingradio.ru/wave96.aacp">📻 Radio Wave</option>
          <option value="https://ep256.hostingradio.ru:8052/europaplus256.mp3">🌍 Европа Плюс</option>
          <option value="https://retro.hostingradio.ru:8043/retro256.mp3">📼 Ретро FM</option>
        </select>
      </div>
    </div>
  </div>

  <audio id="native-audio" playsinline></audio>

  <script>
    let isPlaying = false;
    let audioEl = document.getElementById('native-audio');

    // Датчик поворота автомобиля (курс / азимут)
    let accumulatedTurn = 0;
    let lastHeading = null;
    window.addEventListener('deviceorientation', (e) => {
        let heading = e.webkitCompassHeading !== undefined ? e.webkitCompassHeading : e.alpha;
        if (heading === null && e.gamma === null) return;
        if (heading !== null) {
          if (lastHeading === null) { lastHeading = heading; return; }
          let delta = heading - lastHeading;
          if (delta > 180) delta -= 360;
          if (delta < -180) delta += 360;
          accumulatedTurn += delta * 1.5;
          lastHeading = heading;
        } else if (e.gamma !== null) {
          accumulatedTurn = e.gamma * 2.0;
        }
    });

    document.getElementById('main-play-btn').addEventListener('click', () => {
      const sel = document.getElementById('radio-select');
      const url = sel.value;
      if (isPlaying) {
        audioEl.pause();
        isPlaying = false;
        document.getElementById('main-play-icon').textContent = '▶';
        document.getElementById('source-type-badge').textContent = 'ПАУЗА';
        document.getElementById('live-dot-top').className = 'w-2 h-2 rounded-full bg-amber-400';
      } else {
        audioEl.src = url;
        audioEl.play().then(() => {
          isPlaying = true;
          document.getElementById('main-play-icon').textContent = '⏸';
          document.getElementById('source-type-badge').textContent = 'РАДИО ЭФИР (ОНЛАЙН)';
          document.getElementById('live-dot-top').className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        }).catch(err => {
          alert("Ошибка запуска потока: " + err);
        });
      }
    });

    // Визуализатор
    const canvas = document.getElementById('visualizer-canvas');
    const ctx = canvas.getContext('2d');
    const numBars = 36;
    let currentShiftX = 0;

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      accumulatedTurn *= 0.95; // Автоцентровка
      let targetShiftX = -accumulatedTurn * 6;
      currentShiftX += (targetShiftX - currentShiftX) * 0.1;

      ctx.save();
      ctx.translate(currentShiftX, 0);

      const stepW = canvas.width / numBars;
      const t = performance.now() * 0.008;

      for (let i = 0; i < numBars; i++) {
        let barH = 20;
        if (isPlaying) {
          const wave = Math.sin(t * 3 + i * 0.3) * 45 + Math.cos(t * 1.5 - i * 0.2) * 35;
          const boost = Math.abs(Math.sin(t * 6)) * 60;
          barH = Math.max(15, 60 + wave + boost + (Math.random() * 30));
        } else {
          barH = 15 + Math.sin(t + i * 0.2) * 8;
        }

        const x = i * stepW;
        const y = canvas.height - barH - 10;

        const grad = ctx.createLinearGradient(0, canvas.height, 0, 10);
        grad.addColorStop(0, '#38bdf8');
        grad.addColorStop(1, '#f472b6');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x, y, stepW * 0.75, barH, 4);
        ctx.fill();
      }
      ctx.restore();
    }
    renderLoop();
  </script>
</body>
</html>
